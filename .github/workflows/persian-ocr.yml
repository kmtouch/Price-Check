name: persian-ocr tests

on:
  push:
    paths:
      - 'persian-ocr/**'
      - '.github/workflows/persian-ocr.yml'
  pull_request:
    paths:
      - 'persian-ocr/**'
      - '.github/workflows/persian-ocr.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.13']
    defaults:
      run:
        working-directory: persian-ocr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Check the installation
        run: persian-ocr doctor || true   # no API key on CI; the report is still useful

      - name: Run the test suite
        run: python -m pytest -q
