name: Build Persian OCR APK

on:
  push:
    paths:
      - 'persian-ocr-android/**'
      - '.github/workflows/persian-ocr-android.yml'
  pull_request:
    paths:
      - 'persian-ocr-android/**'
      - '.github/workflows/persian-ocr-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: persian-ocr-android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: persian-ocr-debug-apk
          path: persian-ocr-android/app/build/outputs/apk/debug/*.apk
